name: GitHub Actions Tmate SSH Shell

on:
  workflow_dispatch:

jobs:
  tmate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tmate & Curl
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate curl

      - name: Start Tmate Session
        run: |
          # Mulai tmate session di background socket
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          echo "=============================================="
          echo " SSH ACCESS COMMAND:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo "----------------------------------------------"
          echo " WEB ACCESS URL:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          echo "=============================================="
          
          # Tahan agar job tidak berhenti
          tmate -S /tmp/tmate.sock wait-for tmate-closed
