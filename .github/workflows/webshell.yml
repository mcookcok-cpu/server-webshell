name: GitHub Actions Tmate SSH Shell

on:
  workflow_dispatch:

jobs:
  tmate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tmate & Curl
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate curl

      - name: Start Tmate Session
        run: |
          # Mulai tmate session di background socket
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          # Ambil URL dan SSH command
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          
          echo "=============================================="
          echo " SSH ACCESS COMMAND:"
          echo "$SSH_CMD"
          echo "----------------------------------------------"
          echo " WEB ACCESS URL:"
          echo "$WEB_URL"
          echo "=============================================="
          
          # Tulis ke GitHub Step Summary agar muncul di halaman utama Run (mudah disalin di HP)
          echo "### 🚀 Tmate SSH & Web Access Ready!" >> $GITHUB_STEP_SUMMARY
          echo "**SSH Command (Salin dan paste ke terminal/Termux):**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "$SSH_CMD" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Web Access URL (Buka langsung di browser):**" >> $GITHUB_STEP_SUMMARY
          echo "[Buka Terminal Web Tmate]($WEB_URL)" >> $GITHUB_STEP_SUMMARY
          
          # Tahan agar job tidak berhenti
          tmate -S /tmp/tmate.sock wait-for tmate-closed
